pool:
  name: 'DCRI Agents'
  vmImage: ubuntu-22.04

variables:
  - name: environmentName
    value: 'dev'
  - ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
    - name: environmentName
      value: 'dev'
  - ${{ if eq(variables['Build.SourceBranchName'], 'val') }}:
    - name: environmentName
      value: 'val'
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - name: environmentName
      value: 'prod'
  
  - name: imageName
    value: "$(environmentName)/createMockData"
  - name: tag
    value: '$(Build.BuildId)'
  - name: webAppName
    value: 'app-aitest-$(environmentName)'


stages:
- stage: Init
  displayName: 'Initialize and Select Agent'
  jobs:
  - job: InstallSoftware
    displayName: 'Select Agent'
    steps:
    - bash: echo "##vso[task.setvariable variable=agentValue;isOutput=true]agent-name-goes-here"
      name: setvarStep

- stage: Build
  dependsOn: Init
  variables:
    useThisAgent: $[ stageDependencies.Init.InstallSoftware.outputs['setvarStep.agentValue'] ]
  pool:
    name: 'DCRI Agents'
    demands: Agent.Name -equals $(useThisAgent)
  jobs:
  - job: Build
    steps:
    - script: |
        echo "##[command]Diagnosing Environment Variables..."
        echo "This pipeline was triggered by branch: $(Build.SourceBranchName)"
        echo "Based on the branch, the environmentName variable is set to: $(environmentName)"
      displayName: 'Diagnose Environment Name'
    - task: Docker@2
      displayName: Build an image
      inputs:
        repository: $(imageName)
        command: build
        Dockerfile: Dockerfile
        containerRegistry: 'devops-spn-aitest-prod'
        tags: latest,$(tag)

- stage: Deploy
  dependsOn:
  - Init
  - Build
  condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/dev'), eq(variables['Build.SourceBranch'], 'refs/heads/val'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
  variables:
    useThisAgent: $[ stageDependencies.Init.InstallSoftware.outputs['setvarStep.agentValue'] ]
  pool:
    name: 'DCRI Agents'
    demands: Agent.Name -equals $(useThisAgent)
  jobs:
  - job: Push
    displayName: 'Push Docker Image'
    steps:
    - task: Docker@2
      displayName: 'Push image to Container Registry'
      inputs:
        repository: $(imageName)
        command: push
        containerRegistry: 'devops-spn-aitest-prod'
        tags: latest,$(tag)


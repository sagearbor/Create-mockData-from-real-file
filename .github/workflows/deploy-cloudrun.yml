# REFERENCE ONLY — not the approved deployment route for this service. The
# approved deployment is the organisation's guarded Container Apps procedure.
# This workflow is kept for reference; it no longer requests public access.
#
# .github/workflows/deploy-cloudrun.yml
#
# Deploy the BYOD Mock Data Generator to Google Cloud Run (authentication
# required: --no-allow-unauthenticated).
#
# Dispatch inputs and secrets reach the shell only through `env:` and are
# always quoted; never interpolate ${{ ... }} inside a `run:` script.
#
# ============================================================
# REQUIRED secret (Settings > Secrets and variables > Actions):
#
#   GCP_SA_KEY  — JSON key file for a GCP Service Account that has the
#                 following IAM roles:
#                   - roles/run.admin
#                   - roles/cloudbuild.builds.editor
#                   - roles/artifactregistry.admin
#                   - roles/iam.serviceAccountUser
#                   - roles/storage.admin   (Cloud Build staging bucket)
#
#   NOTE: Workload Identity Federation is the more secure alternative to a
#   long-lived JSON key.  See:
#   https://github.com/google-github-actions/auth#workload-identity-federation
#   When using WIF, replace the `credentials_json` input in the auth step
#   with `workload_identity_provider` and `service_account`.
#
# OPTIONAL secrets (enable real Azure OpenAI generation instead of fallback):
#   AZURE_OPENAI_API_KEY
#   AZURE_OPENAI_ENDPOINT
#   AZURE_OPENAI_CHAT_DEPLOYMENT_NAME
#   AZURE_OPENAI_API_VERSION
#
#   If these secrets are absent the service still deploys successfully and
#   uses the built-in deterministic fallback generator (lower statistical
#   fidelity, but fully functional for smoke testing).
# ============================================================

name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'GCP Project ID'
        required: true
        type: string
      region:
        description: 'GCP Region'
        required: false
        default: 'us-central1'
        type: string
      service:
        description: 'Cloud Run service name'
        required: false
        default: 'mock-data-generator-api'
        type: string

env:
  ARTIFACT_REPO: apps
  # Free-text dispatch inputs: passed as environment variables, never
  # interpolated into shell.
  PROJECT_ID: ${{ inputs.project_id }}
  REGION: ${{ inputs.region }}
  SERVICE: ${{ inputs.service }}
  GIT_SHA: ${{ github.sha }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for Workload Identity Federation

    steps:
      # -------------------------------------------------------------------
      # 1. Checkout source
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # 2. Authenticate to Google Cloud
      # -------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # When migrating to Workload Identity Federation, replace the line
          # above with:
          #   workload_identity_provider: 'projects/<project_number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>'
          #   service_account: '<sa>@<project>.iam.gserviceaccount.com'

      # -------------------------------------------------------------------
      # 3. Set up gcloud CLI
      # -------------------------------------------------------------------
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.project_id }}

      # -------------------------------------------------------------------
      # 4. Ensure Artifact Registry repository exists
      # -------------------------------------------------------------------
      - name: Ensure Artifact Registry repository
        run: |
          IMAGE_HOST="${REGION}-docker.pkg.dev"
          gcloud artifacts repositories create "${ARTIFACT_REPO}" \
            --repository-format=docker \
            --location="${REGION}" \
            --project="${PROJECT_ID}" \
            --description="Container images for BYOD services" \
            2>/dev/null || true
          gcloud auth configure-docker "${IMAGE_HOST}" --quiet

      # -------------------------------------------------------------------
      # 5. Build image via Cloud Build (uses cloudbuild.yaml)
      # -------------------------------------------------------------------
      - name: Build image with Cloud Build
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:${GIT_SHA}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions="_IMAGE=${IMAGE}" \
            --project="${PROJECT_ID}" \
            .

      # -------------------------------------------------------------------
      # 6. Build optional env-vars flag for Azure OpenAI credentials
      # -------------------------------------------------------------------
      - name: Prepare Azure OpenAI env-vars
        id: azure_env
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_CHAT_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_CHAT_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
        run: |
          PAIRS=()
          if [[ -n "${AZURE_OPENAI_API_KEY}" ]]; then
            PAIRS+=("AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}")
          fi
          if [[ -n "${AZURE_OPENAI_ENDPOINT}" ]]; then
            PAIRS+=("AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}")
          fi
          if [[ -n "${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}" ]]; then
            PAIRS+=("AZURE_OPENAI_CHAT_DEPLOYMENT_NAME=${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME}")
          fi
          if [[ -n "${AZURE_OPENAI_API_VERSION}" ]]; then
            PAIRS+=("AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION}")
          fi

          if [[ ${#PAIRS[@]} -gt 0 ]]; then
            JOINED=$(printf "%s," "${PAIRS[@]}")
            JOINED="${JOINED%,}"
            echo "env_flag=--set-env-vars=${JOINED}" >> "${GITHUB_OUTPUT}"
            echo "Found ${#PAIRS[@]} Azure OpenAI credential(s); will pass to Cloud Run."
          else
            echo "env_flag=" >> "${GITHUB_OUTPUT}"
            echo "No Azure OpenAI credentials found; service will use fallback generation."
          fi

      # -------------------------------------------------------------------
      # 7. Deploy to Cloud Run (authentication required)
      # -------------------------------------------------------------------
      - name: Deploy to Cloud Run
        env:
          ENV_FLAG: ${{ steps.azure_env.outputs.env_flag }}
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --no-allow-unauthenticated \
            --port 8080 \
            --project "${PROJECT_ID}" \
            ${ENV_FLAG:+"${ENV_FLAG}"}

      # -------------------------------------------------------------------
      # 8. Retrieve service URL and write to job summary
      # -------------------------------------------------------------------
      - name: Get service URL
        id: service_url
        run: |
          URL=$(gcloud run services describe "${SERVICE}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format="value(status.url)")
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"

      - name: Write job summary
        env:
          SERVICE_URL: ${{ steps.service_url.outputs.url }}
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## Cloud Run Deployment Complete

          | Field | Value |
          |-------|-------|
          | Service | \`${SERVICE}\` |
          | Region | \`${REGION}\` |
          | Project | \`${PROJECT_ID}\` |
          | Image SHA | \`${GIT_SHA}\` |
          | **Service URL** | **${SERVICE_URL}** |

          ### Quick checks

          \`\`\`bash
          # The service requires authentication: send an identity token
          TOKEN=\$(gcloud auth print-identity-token)

          # Health
          curl -H "Authorization: Bearer \${TOKEN}" ${SERVICE_URL}/health

          # Agent card
          curl -H "Authorization: Bearer \${TOKEN}" ${SERVICE_URL}/.well-known/agent.json

          # End-to-end A2A proof
          python3 scripts/e2e_a2a_check.py --url ${SERVICE_URL}
          \`\`\`

          ### Notes

          - The endpoint **requires authentication** (Cloud Run IAM invoker
            role). This path is kept for reference only; the approved
            deployment is the organisation's guarded Container Apps procedure.
          - If the Azure OpenAI secrets were not configured, generation uses the
            **deterministic fallback path** (lower fidelity; still functional).
          EOF
